name: Base de datos (Supabase)

# Aplica las migraciones de supabase/migrations al proyecto de Supabase.
# Necesita tres secretos del repositorio (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN   token personal de Supabase (Account → Access Tokens)
#   SUPABASE_PROJECT_REF    referencia del proyecto (Project Settings → General → Project ID)
#   SUPABASE_DB_PASSWORD    contraseña de la base de datos del proyecto

on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-deploy
  cancel-in-progress: false

jobs:
  push-migrations:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar secretos
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Faltan secretos de Supabase en el repositorio (ver cabecera de este workflow)."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Vincular proyecto
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Migraciones pendientes
        run: supabase migration list --password "$SUPABASE_DB_PASSWORD"
      - name: Aplicar migraciones
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
